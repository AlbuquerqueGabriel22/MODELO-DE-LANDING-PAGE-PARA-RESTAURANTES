<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Login administrativo | Dom do Sabor</title>
</head>
<body class="admin-page">
    <main class="admin-login-main">
        <section class="admin-login-card">
            <p class="eyebrow">Área restrita</p>
            <h1>Login<br><em>administrativo.</em></h1>
            {% if error %}<p class="admin-login-error">{{ error }}</p>{% endif %}
            <form method="post" class="admin-form">
                <label>Usuário<input type="text" name="username" autocomplete="username" required></label>
                <label>Senha<input type="password" name="password" autocomplete="current-password" required></label>
                <button type="submit" class="button button-light">Entrar</button>
            </form>
            <a class="admin-back-link" href="{{ url_for('paginaPrincipal') }}">Voltar ao site</a>
        </section>
    </main>
</body>
</html>
