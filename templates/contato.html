<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Contato | Dom do Sabor</title>
</head>
<body >
    <img style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;" src="/static/images/nova.jpg" alt="imagem de fundo" class="background-image">
    <div class="container-contact">
        <p class="eyebrow">Dom do Sabor</p>
        <h1>Fale com<br><em>a nossa casa.</em></h1>
        <p>Escolha o seu canal! Estamos prontos para receber sua mensagem, sua reserva ou apenas uma boa conversa.</p>
        <div class="contact-list">
            <a class="contact-channel" href="mailto:contato@domdosabor.com">
                <span class="contact-symbol" aria-hidden="true">@</span>
                <span><small>E-mail</small><strong>contato@domdosabor.com</strong></span><span class="contact-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="contact-channel" href="https://wa.me/551112345678" target="_blank" rel="noreferrer">
                <span class="contact-symbol" aria-hidden="true">◉</span>
                <span><small>WhatsApp</small><strong>(11) 12345-6789</strong></span><span class="contact-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="contact-channel" href="https://instagram.com/domdosabor" target="_blank" rel="noreferrer">
                <span class="contact-symbol" aria-hidden="true">◎</span>
                <span><small>Instagram</small><strong>@domdosabor</strong></span><span class="contact-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="contact-channel" href="https://tiktok.com/@domdosabor" target="_blank" rel="noreferrer">
                <span class="contact-symbol" aria-hidden="true">♪</span>
                <span><small>TikTok</small><strong>@domdosabor</strong></span><span class="contact-arrow" aria-hidden="true">↗</span>
            </a>
        </div>
        <a class="btn-custom home-return-button" href="{{ url_for('paginaPrincipal') }}">Voltar para início <span aria-hidden="true">↗</span></a>

    </div>
    <footer>
        <p style="text-align: center;">&copy; 2026 landingpage.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
